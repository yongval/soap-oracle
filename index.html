<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#e6ebdf" />
    <meta
      name="description"
      content="Press the dispenser. Move your hand. Meet your fortune."
    />
    <title>Soap Oracle</title>
    <link
      rel="preload"
      href="fonts/archivo-black.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/dm-sans-variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="style.css?v=embedded-fonts-1" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main
      id="scene"
      tabindex="0"
      aria-label="Soap Oracle artwork. Press the dispenser, then move your pointer or use the arrow keys to move your hand."
    >
      <div class="world" id="world">
        <button
          id="dispenser"
          class="dispenser"
          aria-label="Press the soap dispenser"
          title="Press"
        >
          <svg viewBox="0 0 260 430" aria-hidden="true">
            <defs>
              <clipPath id="windowClip">
                <ellipse cx="127" cy="211" rx="21" ry="48" />
              </clipPath>
            </defs>
            <path
              d="M205 27 L234 41 L234 392 L216 408 L62 408 L46 390 L46 44Z"
              fill="#c5c8c1"
              stroke="#151515"
              stroke-width="5"
              stroke-linejoin="round"
            />
            <path
              d="M55 18 H193 Q218 18 218 43 V387 Q218 405 199 405 H53 Q35 405 35 387 V44 Q35 18 55 18Z"
              fill="#fffef7"
              stroke="#151515"
              stroke-width="5"
            />
            <ellipse cx="127" cy="211" rx="21" ry="48" fill="#f0f2ed" />
            <g clip-path="url(#windowClip)">
              <rect
                id="soapLevel"
                x="104"
                y="161"
                width="46"
                height="100"
                fill="#b9dff3"
              />
            </g>
            <ellipse
              cx="127"
              cy="211"
              rx="21"
              ry="48"
              fill="none"
              stroke="#151515"
              stroke-width="4"
            />
            <path
              d="M117 405 H137"
              stroke="#151515"
              stroke-width="8"
              stroke-linecap="round"
            />
            <g class="press-plate">
              <path
                d="M48 389 V345 Q48 316 77 316 H177 Q205 316 205 345 V399 H58 Q48 399 48 389Z"
                fill="#dadcd5"
                stroke="#151515"
                stroke-width="4"
              />
              <path
                d="M69 336 H185"
                fill="none"
                stroke="#151515"
                stroke-width="3"
              />
            </g>
          </svg>
        </button>
        <div id="stream" class="stream" aria-hidden="true"></div>
        <div id="hand" class="hand">
          <svg viewBox="0 0 380 480" role="img" aria-label="An open hand">
            <path
              fill="#fffef7"
              stroke="#151515"
              stroke-width="4.5"
              stroke-linejoin="round"
              d="M132 479 C137 429 127 412 106 381 C85 353 55 311 39 278 C27 254 29 239 42 236 C57 232 70 249 80 264 L103 294 C97 244 83 159 85 136 C87 115 106 111 116 125 C126 139 132 213 140 241 C139 191 134 83 140 63 C146 44 165 47 171 63 C178 83 176 185 183 225 C186 175 189 68 199 51 C208 35 227 43 228 63 C230 85 220 191 224 232 C234 192 244 115 255 101 C266 87 283 95 281 113 C279 145 260 227 262 262 C271 241 284 207 298 205 C316 203 321 219 313 240 C300 273 288 295 285 324 C282 361 271 392 251 416 L251 479Z"
            />
            <g
              fill="none"
              stroke="#151515"
              stroke-width="3.2"
              stroke-linecap="round"
            >
              <path
                d="M109 298 C131 277 150 278 170 293 C190 308 197 343 183 367"
              />
              <path d="M142 272 C175 258 214 264 245 285" />
              <path d="M149 314 C178 323 218 316 246 299" />
            </g>
          </svg>
          <canvas
            id="soap"
            width="760"
            height="960"
            aria-hidden="true"
          ></canvas>
        </div>
      </div>
    </main>
    <button id="guideOpen" class="dictionary">Shape dictionary</button>
    <dialog id="resultDialog" class="result-dialog" aria-label="Your fortune">
      <button id="resultClose" class="close" aria-label="Close fortune">
        ×</button
      ><canvas
        id="resultShape"
        width="600"
        height="400"
        aria-label="Your actual soap shape"
      ></canvas
      ><output id="fortune" aria-live="polite" aria-atomic="true"></output>
    </dialog>
    <dialog id="guideDialog" aria-labelledby="guideTitle">
      <button id="guideClose" class="close" aria-label="Close shape dictionary">
        ×
      </button>
      <h2 id="guideTitle">Shape Oracle</h2>
      <div id="shapeGrid" class="shape-grid"></div>
    </dialog>
  </body>
</html>
